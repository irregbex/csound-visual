<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, sans-serif" font-size="14">
  <style>
    .box { fill: var(--surface2, #0e1a30); stroke: var(--accent, #1e6bff); stroke-width: 1.5; }
    .t { fill: var(--text, #a8ccff); }
    .d { fill: var(--dim, #5a7bb8); font-size: 12px; }
    .a { stroke: var(--accent, #1e6bff); stroke-width: 1.7; fill: none; marker-end: url(#gm); }
  </style>
  <defs><marker id="gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e6bff"/></marker></defs>

  <rect class="box" x="20" y="30" width="170" height="64" rx="10"/><text class="t" x="35" y="57">CsoundEngine</text><text class="d" x="35" y="77">scope ring · sr</text>
  <rect class="box" x="220" y="30" width="170" height="64" rx="10"/><text class="t" x="235" y="57">AudioFeed</text><text class="d" x="235" y="77">30 Hz copy (UI timer)</text>
  <rect class="box" x="420" y="20" width="200" height="84" rx="10"/><text class="t" x="435" y="47">IScene3D</text><text class="d" x="435" y="67">Waterfall · XYZ pad</text><text class="d" x="435" y="85">Spatial (binaural)</text>
  <rect class="box" x="650" y="20" width="230" height="84" rx="10"/><text class="t" x="665" y="47">GlRenderer</text><text class="d" x="665" y="67">lines · triangles · points</text><text class="d" x="665" y="85">1 shader · dynamic VBO</text>

  <rect class="box" x="420" y="160" width="200" height="70" rx="10"/><text class="t" x="435" y="188">GlView</text><text class="d" x="435" y="208">OpenGlControlBase · camera</text>
  <rect class="box" x="650" y="160" width="230" height="70" rx="10"/><text class="t" x="665" y="188">OpenGL ES 3 (ANGLE)</text><text class="d" x="665" y="208">Direct3D 11 · GPU</text>
  <rect class="box" x="20" y="160" width="370" height="70" rx="10"/><text class="t" x="35" y="188">Mouse → scene → channels</text><text class="d" x="35" y="208">XYZ → SetChannelNormalized · az/el/dist → SendChannel</text>

  <path class="a" d="M190 62 H218"/><path class="a" d="M390 62 H418"/><path class="a" d="M620 62 H648"/>
  <path class="a" d="M520 104 V158"/><path class="a" d="M620 195 H648"/><path class="a" d="M420 195 H392"/>
  <text class="d" x="20" y="275">If context creation, shaders or the context itself fail, GlView raises Failed and the window shows an explanation instead of crashing.</text>
</svg>
