<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, sans-serif" font-size="14">
  <style>
    .box { fill: var(--surface2, #0e1a30); stroke: var(--accent, #1e6bff); stroke-width: 1.5; }
    .alt { fill: var(--surface, #0a1222); stroke: var(--dim, #5a7bb8); stroke-width: 1.5; }
    .t { fill: var(--text, #a8ccff); }
    .h { fill: var(--accent-hi, #5aa0ff); font-weight: 600; }
    .d { fill: var(--dim, #5a7bb8); font-size: 12px; }
    .a { stroke: var(--accent, #1e6bff); stroke-width: 1.8; fill: none; marker-end: url(#ar); }
    .b { stroke: var(--dim, #5a7bb8); stroke-width: 1.6; fill: none; marker-end: url(#ar2); stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e6bff"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a7bb8"/></marker>
  </defs>

  <text class="h" x="30" y="30">A · App-driven WASAPI (default)</text>
  <rect class="box" x="30" y="45" width="150" height="70" rx="10"/>
  <text class="t" x="45" y="75">Csound</text><text class="d" x="45" y="97">PerformKsmps → spout</text>
  <rect class="box" x="220" y="45" width="150" height="70" rx="10"/>
  <text class="t" x="235" y="75">FIFO + mapping</text><text class="d" x="235" y="97">channels · 0dbfs → ±1</text>
  <rect class="box" x="410" y="45" width="160" height="70" rx="10"/>
  <text class="t" x="425" y="75">Format conversion</text><text class="d" x="425" y="97">float32 · int16/24/32</text>
  <rect class="box" x="610" y="45" width="260" height="70" rx="10"/>
  <text class="t" x="625" y="75">WASAPI shared / exclusive</text><text class="d" x="625" y="97">IAudioClient3 · event-driven · MMCSS</text>
  <path class="a" d="M180 80 H218"/><path class="a" d="M370 80 H408"/><path class="a" d="M570 80 H608"/>
  <path class="a" d="M740 115 V140 H105 V117"/>
  <text class="d" x="300" y="160">device event: "give me N frames" → compute ⌈N / ksmps⌉ control cycles</text>

  <text class="h" x="30" y="215">B · Csound-driven (PortAudio → ASIO, MME, WDM-KS)</text>
  <rect class="alt" x="30" y="230" width="150" height="70" rx="10"/>
  <text class="t" x="45" y="260">Csound</text><text class="d" x="45" y="282">PerformKsmps</text>
  <rect class="alt" x="220" y="230" width="230" height="70" rx="10"/>
  <text class="t" x="235" y="260">rtpa module (PortAudio)</text><text class="d" x="235" y="282">-+rtaudio=pa_cb · -b / -B buffers</text>
  <rect class="alt" x="490" y="230" width="380" height="70" rx="10"/>
  <text class="t" x="505" y="260">ASIO driver (e.g. Yamaha Steinberg USB ASIO)</text><text class="d" x="505" y="282">blocks PerformKsmps until the device has room</text>
  <path class="b" d="M180 265 H218"/><path class="b" d="M450 265 H488"/>

  <text class="d" x="30" y="345">Offline render (WAV): Csound writes the file itself, no device involved.</text>
  <text class="d" x="30" y="368">Both paths share CsoundEngine.Step(): UI requests → csoundPerformKsmps → meters/scope → score time → tables.</text>
</svg>
